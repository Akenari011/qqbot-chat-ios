name: CI

"on":
  push:
  pull_request:

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run gateway tests
        run: python -m pytest -q server
      - name: Verify Python and workflow syntax
        run: |
          python -m py_compile server/main.py server/event_bridge.py
          python -c 'import yaml; d=yaml.safe_load(open(".github/workflows/ci.yml")); assert "on" in d and "jobs" in d'

  ios-simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode scheme
        run: xcodebuild -list -project QQBotChat.xcodeproj
      - name: Build iOS Simulator app
        run: xcodebuild -project QQBotChat.xcodeproj -scheme QQBotChat -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
