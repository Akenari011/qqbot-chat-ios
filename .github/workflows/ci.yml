name: CI

"on":
  push:
  pull_request:

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run gateway tests
        run: python -m pytest -q server
      - name: Verify Python and workflow syntax
        run: |
          python -m py_compile server/main.py server/event_bridge.py
          python -c 'import yaml; d=yaml.safe_load(open(".github/workflows/ci.yml")); assert "on" in d and "jobs" in d'

  ios-simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode scheme
        run: xcodebuild -list -project QQBotChat.xcodeproj
      - name: Build iOS Simulator app
        run: xcodebuild -project QQBotChat.xcodeproj -scheme QQBotChat -sdk iphonesimulator -configuration Debug -derivedDataPath build -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: QQBotChat-Simulator
          path: build/Build/Products/Debug-iphonesimulator/QQBotChat.app
          if-no-files-found: error

  container-smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_PASSWORD: container-example-password
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway container
        run: docker build -f server/Dockerfile -t qqbot-chat:test .
      - name: Start isolated test gateway
        run: |
          docker run -d --name qqbot-smoke -p 127.0.0.1:8080:8080 \
            -e QQBOT_CHAT_USERNAME=container-user \
            -e QQBOT_CHAT_PASSWORD="$SMOKE_PASSWORD" \
            -e QQBOT_GATEWAY_KEY=container-internal-key \
            -e QQBOT_CHAT_SCENE=c2c \
            -e QQBOT_CHAT_TARGET_ID=container-openid qqbot-chat:test
      - name: Check real HTTP login and message persistence
        run: python3 server/container_smoke.py
      - name: Stop test container
        if: always()
        run: docker rm -f qqbot-smoke
